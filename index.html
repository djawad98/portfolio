<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Djawad - Portfolio</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#9aa1b2; --accent:#5b8cff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  p.lead { color:var(--muted); margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  a.card { display:block; padding:20px; border-radius:14px; background:var(--card); color:inherit; text-decoration:none; border:1px solid #262a34; transition:border-color .15s, transform .15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-2px); }
  a.card h2 { margin:0 0 6px; font-size:1.15rem; }
  a.card span { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Portfolio</h1>
  <p class="lead">Websites I designed and built.</p>
  <div class="grid">
    <a class="card" href="irparts/"><h2>IR Parts</h2><span>irparts.djawadg.ir</span></a>
    <a class="card" href="namayande3az/"><h2>Namayande3az</h2><span>namayande3az.djawadg.ir</span></a>
    <a class="card" href="ekbatan-med/"><h2>Ekbatan Med</h2><span>ekbatan-med.djawadg.ir</span></a>
    <a class="card" href="rayhashop/"><h2>Rayha Shop</h2><span>rayhashop.djawadg.ir</span></a>
    <a class="card" href="haraworld/"><h2>Hara World</h2><span>haraworld.djawadg.ir</span></a>
    <a class="card" href="hitechshow/"><h2>Hitech Show</h2><span>hitechshow.djawadg.ir</span></a>
  </div>
</main>
</body>
</html>
