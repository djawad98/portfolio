name: Mirror sites and deploy to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download sites as static HTML
        env:
          SITES: irparts namayande3az ekbatan-med rayhashop haraworld hitechshow
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for s in $SITES; do
            echo "::group::$s"
            rm -rf "$s"
            timeout 20m wget --mirror --level=4 --page-requisites --convert-links \
              --adjust-extension --no-parent -e robots=off \
              --no-host-directories --directory-prefix="$s" \
              --restrict-file-names=windows,nocontrol \
              --timeout=30 --tries=3 --wait=0.1 --user-agent="$UA" \
              --reject-regex='(/wp-admin|/wp-json|xmlrpc\.php|/feed/|replytocom|add-to-cart|/cart|/checkout|/my-account)' \
              "https://$s.djawadg.ir/" > "wget-$s.log" 2>&1 || true
            tail -n 3 "wget-$s.log"
            echo "files: $(find "$s" -type f 2>/dev/null | wc -l)  size: $(du -sh "$s" 2>/dev/null | cut -f1)"
            rm -f "wget-$s.log"
            echo "::endgroup::"
          done
          touch .nojekyll

      - name: Build portfolio index
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Djawad - Portfolio</title>
          <style>
            :root { --bg:#0f1115; --card:#181b22; --text:#e8eaf0; --muted:#9aa1b2; --accent:#5b8cff; }
            * { box-sizing:border-box; }
            body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
            main { max-width:960px; margin:0 auto; padding:56px 16px; }
            h1 { font-size:2rem; margin:0 0 8px; }
            p.lead { color:var(--muted); margin:0 0 32px; }
            .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
            a.card { display:block; padding:20px; border-radius:14px; background:var(--card); color:inherit; text-decoration:none; border:1px solid #262a34; transition:border-color .15s, transform .15s; }
            a.card:hover { border-color:var(--accent); transform:translateY(-2px); }
            a.card h2 { margin:0 0 6px; font-size:1.15rem; }
            a.card span { color:var(--muted); font-size:.9rem; }
          </style>
          </head>
          <body>
          <main>
            <h1>Portfolio</h1>
            <p class="lead">Websites I designed and built.</p>
            <div class="grid">
              <a class="card" href="irparts/"><h2>IR Parts</h2><span>irparts.djawadg.ir</span></a>
              <a class="card" href="namayande3az/"><h2>Namayande3az</h2><span>namayande3az.djawadg.ir</span></a>
              <a class="card" href="ekbatan-med/"><h2>Ekbatan Med</h2><span>ekbatan-med.djawadg.ir</span></a>
              <a class="card" href="rayhashop/"><h2>Rayha Shop</h2><span>rayhashop.djawadg.ir</span></a>
              <a class="card" href="haraworld/"><h2>Hara World</h2><span>haraworld.djawadg.ir</span></a>
              <a class="card" href="hitechshow/"><h2>Hitech Show</h2><span>hitechshow.djawadg.ir</span></a>
            </div>
          </main>
          </body>
          </html>
          EOF

      - name: Commit mirrored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update static mirrors" || echo "No changes"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
